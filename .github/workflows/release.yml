name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  GOSSAMER_REPO: gossamer-lang/gossamer
  RUSTUP_TOOLCHAIN: 1.95.0
  # The package checks run without a real display, and their settings and
  # caches stay out of the runner's home.
  SDL_VIDEO_DRIVER: offscreen
  XDG_CONFIG_HOME: ${{ github.workspace }}/.ci-config
  XDG_CACHE_HOME: ${{ github.workspace }}/.ci-cache

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v6

      - name: Read the version
        run: |
          version=$(awk -F'"' '/^version = / { print $2; exit }' project.toml)
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Check the tag names the project's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match project.toml version $VERSION" >&2
            exit 1
          fi

      - name: Install SDL's build dependencies, LLVM and the Gossamer toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config llvm-18 desktop-file-utils dbus \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxfixes-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libegl-dev libgl-dev libdecor-0-dev libdbus-1-dev
          curl -fsSL "https://raw.githubusercontent.com/${GOSSAMER_REPO}/main/scripts/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: gos --version

      - name: Build and package
        run: scripts/package.sh dist

      # The archive as a user gets it, unpacked and run.
      - name: Unpack and run the package
        run: |
          mkdir try
          tar -xzf "dist/feather-launcher-$VERSION-linux-${{ matrix.arch }}.tar.gz" -C try
          bin="try/feather-launcher-$VERSION-linux-${{ matrix.arch }}/bin/feather-launcher"
          test "$("$bin" --version)" = "feather-launcher $VERSION"
          "$bin" --fixture
          (cd dist && sha256sum --check ./*.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: feather-launcher-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: feather-launcher-*
          path: artifacts/
          merge-multiple: true
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
